# 广告内容合规审核配置

# API配置
api:
  maas_url: "https://api.modelarts-maas.com/v1/chat/completions"
  maas_model: "qwen2.5-vl-72b"
  timeout: 60  # API超时时间（秒）
  max_retries: 3  # 最大重试次数
  retry_delay: 2  # 重试延迟（秒）

# OCR配置
ocr:
  max_image_size_mb: 10  # 最大图片大小（MB）
  supported_formats: ["png", "jpg", "jpeg", "webp"]
  extract_layout: true  # 是否提取布局信息
  language: "zh-CN"  # 默认语言

# 审核配置
audit:
  # 广告法违禁词配置
  advertising_law:
    prohibited_words:
      high:
        - "最"
        - "第一"
        - "顶级"
        - "唯一"
        - "国家级"
        - "完美"
        - "绝对"
        - "100%"
        - "百分之百"
        - "特效"
        - "根治"
        - "治愈"
        - "最先进"
        - "最优质"
        - "最有效"
      
      medium:
        - "首选"
        - "最佳"
        - "极品"
        - "绝佳"
        - "顶尖"
        - "超强"
        - "极致"
        - "无敌"
        - "史无前例"
        - "前所未有"
        - "领先"
        - "卓越"
      
      low:
        - "优质"
        - "高效"
        - "专业"
        - "先进"
        - "出色"
        - "优秀"
        - "良好"
        - "可靠"
        - "稳定"
    
    # 风险等级阈值
    risk_thresholds:
      high_count: 3  # 高风险词数量阈值
      medium_count: 5  # 中风险词数量阈值
      total_count: 10  # 总违禁词数量阈值
  
  # 平台规则配置
  platform_rules:
    # 各平台敏感词
    xiaohongshu:
      prohibited:
        - "微信"
        - "QQ"
        - "加我"
        - "私信"
        - "低价"
        - "优惠"
        - "折扣"
        - "免费送"
        - "联系方式"
        - "电话号码"
      
      risk_level: "strict"  # 严格模式
    
    douyin:
      prohibited:
        - "微信"
        - "加好友"
        - "转账"
        - "付款"
        - "低价"
        - "特价"
        - "私聊"
        - "联系方式"
      
      risk_level: "strict"
    
    wechat:
      prohibited:
        - "诱导分享"
        - "集赞"
        - "转发"
        - "关注"
        - "抽奖"
        - "红包"
        - "砍价"
      
      risk_level: "medium"
    
    weibo:
      prohibited:
        - "政治敏感"
        - "谣言"
        - "虚假信息"
        - "侵权"
        - "诽谤"
        - "造谣"
      
      risk_level: "strict"
  
  # 通用敏感词
  general_sensitive:
    - "赌博"
    - "色情"
    - "暴力"
    - "恐怖"
    - "毒品"
    - "诈骗"
    - "传销"

# 报告配置
report:
  format: "markdown"  # 报告格式：markdown/html/text
  include_original: true  # 是否包含原始内容
  include_modified: true  # 是否包含修改后内容
  risk_colors:  # 风险等级颜色
    safe: "green"
    warning: "orange"
    severe: "red"
  
  # 报告模板
  templates:
    markdown: "templates/report.md"
    html: "templates/report.html"
    text: "templates/report.txt"

# 性能配置
performance:
  max_concurrent_ocr: 3  # 最大并发OCR数量
  cache_enabled: true  # 是否启用缓存
  cache_ttl: 3600  # 缓存过期时间（秒）
  batch_size: 5  # 批量处理大小

# 日志配置
logging:
  level: "INFO"  # DEBUG/INFO/WARNING/ERROR
  file: "logs/audit.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# 存储配置
storage:
  reports_dir: "reports"  # 报告存储目录
  images_dir: "images"  # 图片存储目录
  temp_dir: "temp"  # 临时文件目录
  keep_reports_days: 30  # 报告保留天数
  keep_images_days: 7  # 图片保留天数

# 通知配置
notifications:
  enabled: false
  email:
    smtp_server: "smtp.example.com"
    smtp_port: 587
    username: ""
    password: ""
    from_email: "audit@example.com"
    to_emails: []
  
  webhook:
    enabled: false
    url: ""
    secret: ""

# 安全配置
security:
  max_file_size: 52428800  # 最大文件大小50MB
  allowed_mime_types:  # 允许的MIME类型
    - "image/png"
    - "image/jpeg"
    - "image/webp"
    - "text/plain"
    - "text/markdown"
  
  sanitize_input: true  # 是否清理输入
  timeout_seconds: 300  # 处理超时时间

# 集成配置
integrations:
  # 广告法审核技能集成
  ad_compliance_review:
    enabled: true
    skill_path: "ad-compliance-review"
    priority: 1
  
  # 平台规则审核技能集成
  content_review:
    enabled: true
    skill_path: "content-review"
    priority: 2
  
  # 自定义审核规则
  custom_rules:
    enabled: false
    rules_file: "custom_rules.yaml"

# 测试配置
testing:
  enabled: false
  test_cases:
    - input: "我们的产品是最好的"
      expected_risk: "warning"
      expected_violations: 1
    
    - input: "100%有效，国家级认证"
      expected_risk: "severe"
      expected_violations: 2
    
    - input: "优质产品，专业服务"
      expected_risk: "safe"
      expected_violations: 0